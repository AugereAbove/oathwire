name: Prepare change set for review
on:
  workflow_dispatch:
    inputs:
      authorize_plan:
        description: 'Owner authorizes AWS artifact uploads and creating a change set (does NOT execute it)'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: oathwire-beta-deploy
  cancel-in-progress: false
jobs:
  plan:
    if: github.ref == 'refs/heads/main' && inputs.authorize_plan
    environment: production
    runs-on: ubuntu-latest
    env:
      AWS_REGION: eu-central-1
      STACK_NAME: oathwire-beta
      WEB_ORIGIN: ${{ vars.WEB_ORIGIN }}
      AUTH_DOMAIN_PREFIX: ${{ vars.AUTH_DOMAIN_PREFIX }}
      BUDGET_EMAIL: ${{ vars.BUDGET_EMAIL }}
      ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
      CF_EXECUTION_ROLE_ARN: ${{ vars.CF_EXECUTION_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run check
      - uses: aws-actions/setup-sam@v2
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1
      - name: Create an unexecuted change set
        shell: bash
        run: |
          set -euo pipefail
          for key in WEB_ORIGIN AUTH_DOMAIN_PREFIX BUDGET_EMAIL ARTIFACT_BUCKET CF_EXECUTION_ROLE_ARN; do
            test -n "${!key}" || { echo "Missing environment variable: $key"; exit 1; }
          done
          sam validate --lint --template-file infra/template.yaml --region eu-central-1
          sam build --template-file infra/template.yaml
          sam deploy --template-file .aws-sam/build/template.yaml --stack-name "$STACK_NAME" \
            --region eu-central-1 --s3-bucket "$ARTIFACT_BUCKET" --s3-prefix oathwire-beta \
            --role-arn "$CF_EXECUTION_ROLE_ARN" --capabilities CAPABILITY_IAM \
            --parameter-overrides "WebOrigin=$WEB_ORIGIN" "AuthDomainPrefix=$AUTH_DOMAIN_PREFIX" "BudgetEmail=$BUDGET_EMAIL" \
            --no-execute-changeset --no-confirm-changeset --no-fail-on-empty-changeset
      - name: Save review evidence without executing
        shell: bash
        run: |
          set -euo pipefail
          aws cloudformation list-change-sets --stack-name "$STACK_NAME" --region eu-central-1 --output json > change-sets.json
          echo 'Review the exact change-set ARN and resource/role/replacement details in CloudFormation.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This workflow cannot execute a change set or publish the frontend. Execution requires separate owner authorization.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: oathwire-change-set-review
          path: change-sets.json
          retention-days: 7
