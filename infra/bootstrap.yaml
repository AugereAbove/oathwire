AWSTemplateFormatVersion: '2010-09-09'
Description: Oathwire deployment prerequisites; create only after owner change-set approval
Parameters:
  ApplicationStackName:
    Type: String
    Default: oathwire-beta
    AllowedPattern: 'oathwire-[a-z0-9-]+'
Resources:
  Artifacts:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ApplicationStackName}-artifacts-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        {
          BlockPublicAcls: true,
          BlockPublicPolicy: true,
          IgnorePublicAcls: true,
          RestrictPublicBuckets: true,
        }
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }]
      LifecycleConfiguration:
        Rules:
          [
            {
              Id: AbortIncompleteUploads,
              Status: Enabled,
              AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 },
            },
          ]
  ArtifactPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Artifacts
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt Artifacts.Arn, !Sub '${Artifacts.Arn}/*']
            Condition: { Bool: { 'aws:SecureTransport': false } }
  RuntimeBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${ApplicationStackName}-runtime-boundary'
      Description: Maximum permissions for Oathwire Lambda roles; inline role policies narrow these further
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              [dynamodb:GetItem, dynamodb:PutItem, dynamodb:ConditionCheckItem, dynamodb:Query]
            Resource:
              - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ApplicationStackName}-*'
              - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ApplicationStackName}-*/index/*'
          - Effect: Allow
            Action: [sqs:SendMessage, sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes]
            Resource: !Sub 'arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:${ApplicationStackName}-*'
          - Effect: Allow
            Action: [logs:CreateLogStream, logs:PutLogEvents]
            Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/oathwire/${ApplicationStackName}/*:log-stream:*'
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ApplicationStackName}-cloudformation'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          [
            {
              Effect: Allow,
              Principal: { Service: cloudformation.amazonaws.com },
              Action: sts:AssumeRole,
            },
          ]
      Policies:
        - PolicyName: OathwireResourceProvisioning
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [iam:CreateRole, iam:PutRolePermissionsBoundary]
                Resource:
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ApplicationStackName}-api-runtime'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ApplicationStackName}-worker-runtime'
                Condition: { StringEquals: { 'iam:PermissionsBoundary': !Ref RuntimeBoundary } }
              - Effect: Allow
                Action:
                  [
                    iam:GetRole,
                    iam:DeleteRole,
                    iam:GetRolePolicy,
                    iam:PutRolePolicy,
                    iam:DeleteRolePolicy,
                    iam:TagRole,
                    iam:UntagRole,
                    iam:ListRolePolicies,
                    iam:ListAttachedRolePolicies,
                    iam:ListRoleTags,
                  ]
                Resource:
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ApplicationStackName}-api-runtime'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ApplicationStackName}-worker-runtime'
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ApplicationStackName}-api-runtime'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ApplicationStackName}-worker-runtime'
                Condition: { StringEquals: { 'iam:PassedToService': lambda.amazonaws.com } }
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion]
                Resource: !Sub '${Artifacts.Arn}/${ApplicationStackName}/*'
              - Effect: Allow
                Action:
                  [
                    s3:CreateBucket,
                    s3:DeleteBucket,
                    s3:GetBucketLocation,
                    s3:GetBucketPolicy,
                    s3:PutBucketPolicy,
                    s3:DeleteBucketPolicy,
                    s3:GetBucketPublicAccessBlock,
                    s3:PutBucketPublicAccessBlock,
                    s3:GetEncryptionConfiguration,
                    s3:PutEncryptionConfiguration,
                    s3:GetBucketTagging,
                    s3:PutBucketTagging,
                    s3:GetBucketVersioning,
                    s3:GetBucketOwnershipControls,
                  ]
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ApplicationStackName}-frontend-${AWS::AccountId}-${AWS::Region}'
              - Effect: Allow
                Action:
                  [
                    dynamodb:CreateTable,
                    dynamodb:DescribeTable,
                    dynamodb:UpdateTable,
                    dynamodb:DeleteTable,
                    dynamodb:DescribeTimeToLive,
                    dynamodb:UpdateTimeToLive,
                    dynamodb:DescribeContinuousBackups,
                    dynamodb:UpdateContinuousBackups,
                    dynamodb:ListTagsOfResource,
                    dynamodb:TagResource,
                    dynamodb:UntagResource,
                  ]
                Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ApplicationStackName}-*'
              - Effect: Allow
                Action:
                  [
                    sqs:CreateQueue,
                    sqs:DeleteQueue,
                    sqs:GetQueueUrl,
                    sqs:GetQueueAttributes,
                    sqs:SetQueueAttributes,
                    sqs:TagQueue,
                    sqs:UntagQueue,
                    sqs:ListQueueTags,
                  ]
                Resource: !Sub 'arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:${ApplicationStackName}-*'
              - Effect: Allow
                Action:
                  [
                    lambda:CreateFunction,
                    lambda:UpdateFunctionCode,
                    lambda:UpdateFunctionConfiguration,
                    lambda:DeleteFunction,
                    lambda:GetFunction,
                    lambda:GetFunctionConfiguration,
                    lambda:GetPolicy,
                    lambda:AddPermission,
                    lambda:RemovePermission,
                    lambda:PutFunctionConcurrency,
                    lambda:DeleteFunctionConcurrency,
                    lambda:GetFunctionConcurrency,
                    lambda:TagResource,
                    lambda:UntagResource,
                    lambda:ListTags,
                  ]
                Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${ApplicationStackName}-*'
              - Effect: Allow
                Action: lambda:CreateEventSourceMapping
                Resource: '*'
                Condition:
                  ArnLike:
                    lambda:FunctionArn: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${ApplicationStackName}-*'
              - Effect: Allow
                Action:
                  [
                    lambda:GetEventSourceMapping,
                    lambda:UpdateEventSourceMapping,
                    lambda:DeleteEventSourceMapping,
                  ]
                Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:event-source-mapping:*'
                Condition:
                  ArnLike:
                    lambda:FunctionArn: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${ApplicationStackName}-worker'
              - Effect: Allow
                Action: [lambda:TagResource, lambda:UntagResource, lambda:ListTags]
                Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:event-source-mapping:*'
              - Effect: Allow
                Action:
                  [
                    logs:CreateLogGroup,
                    logs:DeleteLogGroup,
                    logs:PutRetentionPolicy,
                    logs:DeleteRetentionPolicy,
                    logs:TagResource,
                    logs:UntagResource,
                    logs:ListTagsForResource,
                    logs:PutMetricFilter,
                    logs:DescribeMetricFilters,
                    logs:DeleteMetricFilter,
                  ]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/oathwire/${ApplicationStackName}/*'
              - Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: '*'
                Condition: { StringEquals: { 'aws:RequestedRegion': !Ref 'AWS::Region' } }
              - Effect: Allow
                Action:
                  [
                    cloudwatch:PutMetricAlarm,
                    cloudwatch:DeleteAlarms,
                    cloudwatch:DescribeAlarms,
                    cloudwatch:TagResource,
                    cloudwatch:UntagResource,
                    cloudwatch:ListTagsForResource,
                  ]
                Resource: !Sub 'arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${ApplicationStackName}-*'
              - Effect: Allow
                Action:
                  [
                    events:PutRule,
                    events:DescribeRule,
                    events:DeleteRule,
                    events:PutTargets,
                    events:RemoveTargets,
                    events:ListTargetsByRule,
                    events:TagResource,
                    events:UntagResource,
                    events:ListTagsForResource,
                  ]
                Resource: !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${ApplicationStackName}-*'
              - Effect: Allow
                Action:
                  [
                    sns:CreateTopic,
                    sns:DeleteTopic,
                    sns:GetTopicAttributes,
                    sns:SetTopicAttributes,
                    sns:Subscribe,
                    sns:TagResource,
                    sns:UntagResource,
                    sns:ListTagsForResource,
                  ]
                Resource: !Sub 'arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:${ApplicationStackName}-*'
              - Effect: Allow
                Action: [sns:GetSubscriptionAttributes, sns:Unsubscribe]
                Resource: !Sub 'arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:${ApplicationStackName}-*'
              - Effect: Allow
                Action: cognito-idp:DescribeUserPoolDomain
                Resource: '*'
                Condition: { StringEquals: { 'aws:RequestedRegion': !Ref 'AWS::Region' } }
              - Effect: Allow
                Action: cognito-idp:CreateUserPool
                Resource: '*'
                Condition:
                  {
                    StringEquals:
                      {
                        'aws:RequestedRegion': !Ref 'AWS::Region',
                        'aws:RequestTag/OathwireStack': !Ref ApplicationStackName,
                      },
                  }
              - Effect: Allow
                Action: cognito-idp:TagResource
                Resource: !Sub 'arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*'
                Condition:
                  {
                    StringEquals: { 'aws:RequestTag/OathwireStack': !Ref ApplicationStackName },
                    StringEqualsIfExists:
                      { 'aws:ResourceTag/OathwireStack': !Ref ApplicationStackName },
                  }
              - Effect: Allow
                Action:
                  [
                    cognito-idp:DescribeUserPool,
                    cognito-idp:UpdateUserPool,
                    cognito-idp:DeleteUserPool,
                    cognito-idp:CreateUserPoolClient,
                    cognito-idp:DescribeUserPoolClient,
                    cognito-idp:UpdateUserPoolClient,
                    cognito-idp:DeleteUserPoolClient,
                    cognito-idp:CreateUserPoolDomain,
                    cognito-idp:UpdateUserPoolDomain,
                    cognito-idp:DeleteUserPoolDomain,
                    cognito-idp:UntagResource,
                    cognito-idp:ListTagsForResource,
                  ]
                Resource: !Sub 'arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*'
                Condition:
                  { StringEquals: { 'aws:ResourceTag/OathwireStack': !Ref ApplicationStackName } }
              - Effect: Allow
                Action: apigateway:GET
                Resource:
                  [
                    !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis',
                    !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis/*',
                  ]
              - Effect: Allow
                Action: apigateway:POST
                Resource: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis'
              - Effect: Allow
                Action: [apigateway:POST, apigateway:PUT, apigateway:PATCH, apigateway:DELETE]
                Resource: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis/*'
                Condition:
                  { StringEquals: { 'aws:ResourceTag/OathwireStack': !Ref ApplicationStackName } }
              - Effect: Allow
                Action:
                  [
                    apigateway:GET,
                    apigateway:POST,
                    apigateway:PUT,
                    apigateway:PATCH,
                    apigateway:DELETE,
                  ]
                Resource: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}::/tags/*'
                Condition:
                  {
                    StringEqualsIfExists:
                      { 'aws:ResourceTag/OathwireStack': !Ref ApplicationStackName },
                  }
              - Effect: Allow
                Action:
                  [
                    cloudfront:CreateDistribution,
                    cloudfront:CreateOriginAccessControl,
                    cloudfront:CreateResponseHeadersPolicy,
                  ]
                Resource: '*'
              - Effect: Allow
                Action:
                  [
                    cloudfront:GetDistribution,
                    cloudfront:GetDistributionConfig,
                    cloudfront:UpdateDistribution,
                    cloudfront:DeleteDistribution,
                    cloudfront:UntagResource,
                    cloudfront:ListTagsForResource,
                  ]
                Resource: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*'
                Condition:
                  { StringEquals: { 'aws:ResourceTag/OathwireStack': !Ref ApplicationStackName } }
              - Effect: Allow
                Action: cloudfront:TagResource
                Resource: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*'
                Condition:
                  StringEquals: { 'aws:RequestTag/OathwireStack': !Ref ApplicationStackName }
                  StringEqualsIfExists:
                    { 'aws:ResourceTag/OathwireStack': !Ref ApplicationStackName }
              - Effect: Allow
                Action:
                  [
                    cloudfront:GetOriginAccessControl,
                    cloudfront:GetOriginAccessControlConfig,
                    cloudfront:UpdateOriginAccessControl,
                    cloudfront:DeleteOriginAccessControl,
                    cloudfront:GetResponseHeadersPolicy,
                    cloudfront:GetResponseHeadersPolicyConfig,
                    cloudfront:UpdateResponseHeadersPolicy,
                    cloudfront:DeleteResponseHeadersPolicy,
                  ]
                Resource:
                  [
                    !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:origin-access-control/*',
                    !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:response-headers-policy/*',
                  ]
              - Effect: Allow
                Action: [budgets:ViewBudget, budgets:ModifyBudget]
                Resource: !Sub 'arn:${AWS::Partition}:budgets::${AWS::AccountId}:budget/${ApplicationStackName}-monthly'
Outputs:
  ArtifactBucket: { Value: !Ref Artifacts }
  ExecutionRoleArn: { Value: !GetAtt ExecutionRole.Arn }
  RuntimeBoundaryArn: { Value: !Ref RuntimeBoundary }
